[theme]
base = "light"
primaryColor = "#0f4c81"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f7f9fb"
textColor = "#263238"
font = "sans serif"

[server]
maxUploadSize = 200
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "none"
toolbarMode = "viewer"
